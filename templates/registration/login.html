{% extends 'base.html' %}
{% block title %}Login - Auction Portal{% endblock %}

{% block content %}
<div class="auth-box">
  <h1>Login</h1>

  {% if form.errors %}
    <p class="form-error">Your username and password didn't match. Please try again.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    {{ form.username }}
    <label for="id_password">Password</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary btn-large">Login</button>
  </form>

  <a href="{% url 'register' %}" class="btn btn-secondary btn-large">Create Account</a>
</div>
{% endblock %}
